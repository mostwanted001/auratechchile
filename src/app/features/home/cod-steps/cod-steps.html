<section class="relative isolate overflow-hidden bg-navy-950 py-20 text-white md:py-28">
  <div class="pointer-events-none absolute top-1/2 left-1/2 -z-10 h-96 w-[800px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-aura opacity-15 blur-3xl"></div>

  <div class="mx-auto max-w-7xl px-5">
    <div class="mx-auto max-w-2xl text-center">
      <p class="text-xs font-semibold tracking-[.2em] text-aura-cyan uppercase">Compra sin riesgo</p>
      <h2 class="mt-3 text-3xl !text-white md:text-5xl">
        Pagas <span class="text-aura">cuando lo tienes</span> en tus manos
      </h2>
      <p class="mt-4 text-navy-200 md:text-lg">Así de simple funciona el pago contra entrega.</p>
    </div>

    <ol class="mt-14 grid gap-6 md:grid-cols-3">
      @for (s of steps; track s.title; let i = $index) {
        <li class="relative rounded-card border border-white/10 bg-white/[.03] p-7 backdrop-blur transition hover:border-white/25">
          <div class="flex items-center gap-4">
            <span class="grid h-12 w-12 place-items-center rounded-full bg-aura text-white">
              <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path [attr.d]="s.icon" />
              </svg>
            </span>
            <span class="font-display text-5xl font-bold text-white/10">0{{ i + 1 }}</span>
          </div>
          <h3 class="mt-6 text-xl !text-white">{{ s.title }}</h3>
          <p class="mt-2 leading-relaxed text-navy-200">{{ s.text }}</p>
        </li>
      }
    </ol>

    <div class="mt-12 text-center">
      <a routerLink="/catalogo" class="btn-cta px-8">Ver productos</a>
    </div>
  </div>
</section>
